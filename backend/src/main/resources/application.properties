spring.application.name=backend

spring.jpa.hibernate.ddl-auto=update

# OpenAPI / Swagger UI (springdoc) — UI: /swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.show-actuator=false

app.jwt.secret=${APP_JWT_SECRET:senior-house-development-secret-change-me-please}
app.jwt.expiration-seconds=${APP_JWT_EXPIRATION_SECONDS:86400}

app.sample-data.enabled=${APP_SAMPLE_DATA_ENABLED:true}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}